[package]
name = "client"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
base64 = "0.23.1"
blake2 = "0.11.0"
chacha20poly1305 = "0.11.0"
chrono = "0.4.45"
ed25519-dalek = { version = "3.0.0", features = ["rand_core", "serde", "zeroize"] }
nom = "8.0.0"
prost = "0.14.4"
proto = { path = "../proto/" }
protocol = { path = "../protocol/" }
rand = "0.10.2"
rusqlite = { version = "0.37.0", features = [] }
rustls = { version = "0.23.43", default-features = false, features = ["logging", "std", "ring"] }
serde = "1.0.229"
strum_macros = "0.28"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "full"] }
tokio-rusqlite = { version = "0.7.0", features = [] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["logging", "ring"] }
tokio-stream = "0.1.19"
tonic = { version = "0.14.6", features = ["tls-ring", "transport", "tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tree = "0.4.1"
x25519-dalek = { version = "3.0.0", features = ["getrandom", "static_secrets", "reusable_secrets", "serde", "zeroize"] }
xdg = "3.0.0"

